<div class="backdrop" (click)="isclosedDialog()"></div>
<dialog open>
  <h2>Add Task</h2>
    <!--Para que [(ngModel)] funcione dentro de una etiqueta <form>, 
    es obligatorio que el input tenga el atributo name (en este caso, name="title").
    Se conoce esto como two way binding.
    És necesario importar FormsModule en el módulo para que funcione -->
  <form (ngSubmit)="onSubmit()">
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" [(ngModel)]="enteredTitle" />
    </p>

    <p>
      <label for="summary">Summary</label>
      <textarea id="summary" rows="5" name="summary" [(ngModel)]="enteredSummary"></textarea>
    </p>

    <p>
      <label for="due-date">Due Date</label>
      <input type="date" id="due-date" name="due-date" [(ngModel)]="enteredDate" />
    </p>

    <p class="actions">
      <button type="button" (click)="isclosedDialog()">Cancel</button>
      <button type="submit">Create</button>
    </p>
  </form>
</dialog>
