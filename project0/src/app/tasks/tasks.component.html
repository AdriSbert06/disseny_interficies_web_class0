<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
  </header>

  <ul>
    <!-- One <li> per task that belongs to the selected user.
         track task.id lets Angular keep each card's DOM when the list changes. -->
    @for (task of selectedUserTasks; track task.id) {
      <li>
        <app-task [task]="task" />
      </li>
    } @empty {
      <!-- Shown when the selected user has no tasks left -->
      <li>No tasks for this user.</li>
    }
  </ul>
</section>
